services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: apex-skills-hub:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "8188:3000"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
